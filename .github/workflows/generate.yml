name: Générer les wallpapers TMDB France

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer les wallpapers français
        env:
          TMDB_BEARER_TOKEN: ${{ secrets.TMDB_BEARER_TOKEN }}
          TMDB_LANGUAGE: fr-FR
        run: python generate.py

      - name: Enregistrer les wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wallpapers/
          git diff --cached --quiet || git commit -m "Mise à jour des wallpapers TMDB France"
          git push
